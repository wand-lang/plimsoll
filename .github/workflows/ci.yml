name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The checks that need no cluster: the sources, the tests, and the
  # generated modules.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The wand that wand.pkg asks for, so CI and the package cannot drift
      # apart.
      - name: Install wand
        run: |
          version=$(sed -nE 's/^, wand *= *([0-9.]+).*/\1/p' wand.pkg)
          curl -fsSL "https://raw.githubusercontent.com/wand-lang/wand/v$version/install.sh" \
            | WAND_VERSION="$version" WAND_INSTALL_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Typecheck the sources
        run: wand t app.wand _gen.wand _drift.wand cli.wand plimsoll.wand test_*.wand examples/*.wand tools/*.wand

      - name: Run the tests
        run: wand s

      - name: Typecheck the generated modules
        run: wand t k8s/*/*.wand

      # gen must write what wand f writes. If a module changes here, change
      # the generator, not the module.
      - name: The generated modules are wand f fixed points
        run: |
          for f in k8s/*/*.wand; do
            cp "$f" "$RUNNER_TEMP/x.wand"
            wand f "$RUNNER_TEMP/x.wand" > /dev/null
            cmp "$f" "$RUNNER_TEMP/x.wand"
          done

  # The end-to-end test against a real API server: tools/e2e.wand on a kind
  # cluster. kind v0.33.0 runs Kubernetes v1.37.0, which is what k8s/ was
  # generated from, so `check` has to match.
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install wand
        run: |
          version=$(sed -nE 's/^, wand *= *([0-9.]+).*/\1/p' wand.pkg)
          curl -fsSL "https://raw.githubusercontent.com/wand-lang/wand/v$version/install.sh" \
            | WAND_VERSION="$version" WAND_INSTALL_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create a kind cluster
        run: |
          base=https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0
          curl -fsSLo kind "$base/kind-linux-amd64"
          curl -fsSL "$base/kind-linux-amd64.sha256sum" | awk '{print $1 "  kind"}' | sha256sum -c
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind create cluster --name plimsoll --wait 120s
          kubectl version

      - name: The end-to-end test
        run: wand tools/e2e.wand
